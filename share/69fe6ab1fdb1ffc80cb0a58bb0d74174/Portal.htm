<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%224%22/%3E%3Cellipse cx=%2232%22 cy=%2232%22 rx=%2212%22 ry=%2227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%223%22/%3E%3Cpath d=%22M7 32h50M12 20h40M12 44h40%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%223%22/%3E%3C/svg%3E">
<style>

:root {
    --sidebar-width: 120px;
    --sidebar-bg: #202124;
    --link-hover-bg: #45474b;
    --link-hover-border: #a7abb0;
    --link-hover-green: #7ed957;
    --text: #edf2f7;
}

* { box-sizing: border-box; }

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #fff;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
}

.sidebar {
    container-type: inline-size;
    container-name: sidebar;
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    width: var(--sidebar-width);
    padding: 16px 10px;
    background: var(--sidebar-bg);
    border-right: 1px solid #3c4043;
    box-shadow: 2px 0 8px rgba(0, 0, 0, .28);
}

.portal-links {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    gap: 4px;
    margin: 0;
}

.portal-links a {
    display: flex;
    align-items: center;
    min-height: 32px;
    padding: 8px 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease;
}


.portal-link-favicon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-right: 8px;
    border-radius: 3px;
    object-fit: contain;
}

.portal-link-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.portal-divider {
    width: calc(100% - 16px);
    height: 1px;
    margin: 8px auto;
    border: 0;
    background: #d3d3d3;
}

.portal-links a:hover,
.portal-links a:focus-visible {
    background: var(--link-hover-bg);
    border-color: var(--link-hover-border);
    color: #fff;
    outline: 0;
}

.portal-bottom {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    margin-top: auto;
}

.portal-bottom .portal-divider {
    margin: 0 auto 8px;
}

.portal-bottom .portal-datetime {
    margin: 0;
}

.portal-datetime {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 100%;
    min-height: 66px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
}
.portal-datetime .weekday,
.portal-datetime .date {
    color: #cbd1d8;
    font-size: 12px;
    font-weight: 700;
}
.portal-datetime .time {
    color: #fff;
    font-size: 14px;
    font-weight: 700;
}

.sidebar-resizer {
    position: fixed; top: 0; bottom: 0; left: calc(var(--sidebar-width) - 4px); z-index: 30;
    width: 8px; cursor: col-resize; touch-action: none;
}
.sidebar-resizer:hover, body.resizing .sidebar-resizer { background: rgba(126,217,87,.28); }
.sidebar-toggle { display:none; }
body.sidebar-collapsed .sidebar { transform: translateX(calc(-1 * var(--sidebar-width))); }
body.sidebar-collapsed .portal-frame-container { left: 0; }
body.sidebar-collapsed .sidebar-resizer { display: none; }
body.sidebar-collapsed .sidebar-toggle { display:grid; position:fixed; left:0; top:50%; bottom:auto; transform:translateY(-50%); z-index:40; width:30px; height:94px; padding:0; border:1px solid #666b70; border-left:0; border-radius:0 9px 9px 0; background:transparent; color:#fff; cursor:pointer; overflow:hidden; font-family:'Segoe UI Light','Segoe UI',Arial,sans-serif; font-size:13px; font-weight:300; letter-spacing:1.5px; word-spacing:1px; line-height:1; place-items:center; writing-mode:vertical-rl; text-orientation:mixed; }
body.sidebar-collapsed .sidebar-toggle .sidebar-toggle-label { position:relative; z-index:2; display:inline-block; transform:rotate(180deg); color:#fff; opacity:1; filter:none; text-shadow:0 0 1px #000,0 1px 2px #000; }
body.sidebar-collapsed .sidebar-toggle::before { content:''; position:absolute; inset:0; z-index:0; background:rgba(0,0,0,.7); border-radius:inherit; pointer-events:none; }
body.sidebar-collapsed .sidebar-toggle:hover, body.sidebar-collapsed .sidebar-toggle:focus-visible { background:transparent; border-color:var(--link-hover-green); color:#fff; outline:0; }
.sidebar, .portal-frame-container { transition: transform .2s ease, left .2s ease; }
body.resizing .sidebar, body.resizing .portal-frame-container { transition:none; }
.portal-frame-container { left: 0; }
body.sidebar-collapsed .sidebar-resizer { display: none; }
body.sidebar-collapsed .sidebar-toggle { left: 0; border-left: 1px solid #4f5357; }
.sidebar, .portal-frame-container, .sidebar-toggle { transition: transform .2s ease, left .2s ease; }
body.resizing .sidebar, body.resizing .portal-frame-container, body.resizing .sidebar-toggle { transition: none; }
.portal-frame-container {
    position: fixed;
    inset: 0 0 0 var(--sidebar-width);
    overflow: hidden;
}

#portalFrame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
}

@media (max-width: 700px) {
    :root { --sidebar-width: 120px; }
    .sidebar { padding: 12px 9px; }
    .portal-links a { padding: 7px 10px; }
}

/* Editable portal elements */
.portal-links { overflow-y:auto; min-height:0; }
.portal-links a { cursor:pointer; }
.portal-links a:active { cursor:pointer; }
.portal-links a.dragging { opacity:.35; }
.drop-marker { display:none; flex:0 0 auto; width:calc(100% - 16px); height:3px; margin:1px auto; border-radius:999px; background:var(--link-hover-green); box-shadow:0 0 7px rgba(126,217,87,.7); pointer-events:none; }
.portal-divider.editable-divider { position:relative; height:13px; margin:2px auto; border:0; background:linear-gradient(to bottom, transparent 6px, #d3d3d3 6px, #d3d3d3 7px, transparent 7px); cursor:default; transition:opacity .15s ease, background-color .15s ease; }
body.edit-mode .portal-divider.editable-divider { width:100%; cursor:grab; border:1px solid rgba(126,217,87,.3); border-radius:8px; background:linear-gradient(to bottom, transparent 5px, #d3d3d3 5px, #d3d3d3 6px, transparent 6px); }
body.edit-mode .portal-divider.editable-divider:active { cursor:grabbing; }
.portal-divider.editable-divider.dragging { opacity:.35; }

.add-wrap { position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 8px 10px; }
.add-element-button { display:grid; place-items:center; width:42px; height:30px; border:1px solid #666b70; border-radius:8px; background:transparent; color:#fff; font-size:20px; line-height:1; cursor:pointer; }
.bottom-toggle { display:grid; place-items:center; width:42px; height:30px; padding:0; border:1px solid #666b70; border-radius:8px; background:transparent; color:#fff; font-size:20px; line-height:1; cursor:pointer; }
.bottom-toggle:hover,.bottom-toggle:focus-visible { background:var(--link-hover-bg); border-color:var(--link-hover-green); color:var(--link-hover-green); outline:0; }
.add-element-button:hover,.add-element-button:focus-visible { background:var(--link-hover-bg); border-color:var(--link-hover-green); color:var(--link-hover-green); outline:0; }
.add-menu { position:fixed; left:calc(var(--sidebar-width) + 12px); bottom:12px; z-index:50; display:none; width:280px; max-width:calc(100vw - var(--sidebar-width) - 24px); min-width:220px; padding:10px; border:1px solid #565a5d; border-radius:10px; background:#26282b; box-shadow:0 12px 34px rgba(0,0,0,.42); }
.add-menu.open { display:block; }
.add-menu-title { margin:0 0 8px; color:#fff; font-size:14px; font-weight:700; }
.add-menu-hint { margin:0 0 10px; color:#bfc5ca; font-size:12px; line-height:1.4; }
body.edit-mode .portal-links a { cursor:grab; border-color:rgba(126,217,87,.3); }
body.edit-mode .portal-links a:active, body.edit-mode .portal-links a.dragging { cursor:grabbing; }
.stock-ticker { display:flex; flex-direction:column; align-items:center; width:100%; padding:8px 0; border:1px solid transparent; border-radius:8px; background:transparent; color:#fff; text-align:center; user-select:none; box-sizing:border-box; cursor:pointer; transition:background-color .18s ease, color .18s ease, border-color .18s ease; }
.stock-ticker:hover,.stock-ticker:focus-visible { background:var(--link-hover-bg); border-color:var(--link-hover-border); color:#fff; outline:0; }
.stock-ticker-name { width:100%; overflow:hidden; font-size:14px; font-weight:700; white-space:nowrap; text-overflow:ellipsis; }
.stock-ticker-market { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; column-gap:1px; row-gap:1px; width:100%; min-width:0; margin-top:2px; white-space:nowrap; overflow:hidden; }
.stock-ticker-market .stock-ticker-price { flex:0 0 auto; }
.stock-ticker-market .stock-ticker-change { flex:0 0 auto; }
@container sidebar (max-width: 126px) { .stock-ticker-market .stock-ticker-change { flex-basis:100%; text-align:center; } }
.stock-ticker-price { min-width:0; font-size:14px; font-weight:600; white-space:nowrap; }
.stock-ticker-change { margin-top:0; font-size:11px; font-weight:700; white-space:nowrap; }
.stock-ticker-change.positive { color:#58d26f; }
.stock-ticker-change.negative { color:#ff6262; }
.stock-ticker-change.neutral { color:#b8bec5; }
body.edit-mode .stock-ticker { cursor:grab; border-color:rgba(126,217,87,.3); }
body.edit-mode .stock-ticker:active, body.edit-mode .stock-ticker.dragging { cursor:grabbing; }
.add-menu button { display:block; width:100%; padding:8px 10px; border:0; border-radius:7px; background:transparent; color:#fff; text-align:left; font:inherit; font-size:14px; cursor:pointer; white-space:normal; }
.add-menu button:hover { background:#45474b; }
.add-menu-transfer { display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid #565a5d; }
.add-menu-transfer button { flex:1; width:auto; text-align:center; border:1px solid #565a5d; background:#303235; }
.delete-all-portal { margin-top:8px; border:1px solid #9b5151 !important; color:#ffb5b5 !important; text-align:center !important; background:transparent !important; }
.delete-all-portal:hover,.delete-all-portal:focus-visible { background:rgba(155,81,81,.18) !important; border-color:#d46b6b !important; outline:0; }
#importPortalFile { display:none; }
.edit-backdrop { position:fixed; inset:0; z-index:100; display:none; place-items:center; padding:16px; background:rgba(0,0,0,.46); }
.edit-backdrop.open { display:grid; }
.edit-dialog { width:min(460px,100%); border:1px solid #565a5d; border-radius:14px; background:#26282b; color:#f3f5f7; box-shadow:0 18px 55px rgba(0,0,0,.42); overflow:hidden; }
.edit-head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #44484c; }
.edit-head h2 { margin:0; font-size:17px; }
.edit-close { border:0; background:transparent; color:#ddd; font-size:22px; cursor:pointer; }
.edit-body { display:grid; gap:12px; padding:16px; }
.edit-field { display:grid; gap:6px; color:#cfd5dc; font-size:13px; font-weight:650; }
.edit-field input[type=text] { width:100%; height:38px; padding:8px 10px; border:1px solid #62676d; border-radius:8px; background:#17191b; color:#fff; outline:0; }
.edit-field input[type=text]:focus { border-color:var(--link-hover-green); }
.target-row { display:flex; gap:18px; flex-wrap:wrap; color:#eee; font-size:14px; font-weight:400; }
.target-row label { display:flex; align-items:center; gap:6px; }
.edit-actions { display:flex; justify-content:space-between; gap:8px; padding:0 16px 16px; }
.edit-actions-right { display:flex; gap:8px; margin-left:auto; }
.edit-btn { padding:8px 11px; border:1px solid #656a70; border-radius:8px; background:#35383c; color:#fff; cursor:pointer; }
.edit-btn.primary { border-color:#76c951; background:#65b443; color:#10200b; font-weight:700; }
.edit-btn.delete { border-color:#9b5151; background:transparent; color:#ffb5b5; }

</style>
</head>
<body>
<aside class="sidebar">
    <div class="portal-links" id="portalLinks" aria-label="Portal-Links"></div><div class="portal-bottom">
    <div class="add-wrap">
        <button class="add-element-button" id="addElementButton" type="button" aria-label="Portal bearbeiten" title="Portal bearbeiten">⚙</button>
        <button class="bottom-toggle" id="bottomToggle" type="button" aria-label="Portalmenü einklappen" title="Portalmenü einklappen">‹</button>
        <div class="add-menu" id="addMenu" aria-hidden="true"><div class="add-menu-title">Bearbeitungsmodus</div><div class="add-menu-hint">Elemente können jetzt per Drag &amp; Drop verschoben werden. Über die rechte Maustaste können Links bearbeitet bzw. gelöscht und Trennstriche gelöscht werden.</div>
            <button type="button" id="addLinkItem">＋ Link hinzufügen</button>
            <button type="button" id="addDividerItem">— Trennstrich hinzufügen</button><button type="button" id="addStockItem">▥ Aktienticker hinzufügen</button><div class="add-menu-transfer"><button type="button" id="importPortal">Import</button><button type="button" id="exportPortal">Export</button></div><button type="button" id="deleteAllPortal" class="delete-all-portal">Alle Einträge löschen</button><input type="file" id="importPortalFile" accept="application/json,.json">
        </div>
    </div>
<hr class="portal-divider" aria-hidden="true">
<div class="portal-datetime" aria-label="Wochentag, Datum und Uhrzeit"><span class="weekday" id="portalWeekday">---</span><span class="date" id="portalDate">--.--.----</span><span class="time" id="portalTime">--:--</span></div>
</div>
</aside>
<div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="Breite des Portalmenüs ändern"></div>
<button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Portalmenü einklappen" title="Portalmenü ein-/ausklappen"><span class="sidebar-toggle-label" id="sidebarToggleLabel">‹</span></button>
<div class="edit-backdrop" id="editBackdrop" aria-hidden="true">
<form class="edit-dialog" id="editForm">
 <div class="edit-head"><h2 id="editTitle">Link bearbeiten</h2><button class="edit-close" id="editClose" type="button">×</button></div>
 <div class="edit-body">
  <label class="edit-field">Name<input type="text" id="editName" maxlength="40" required></label>
  <label class="edit-field">Link<input type="text" id="editUrl" placeholder="URL oder lokaler/relativer Pfad"></label>
  <div class="edit-field"><span>Öffnen in</span><div class="target-row"><label><input type="radio" name="editTarget" value="portalFrame"> PortalFrame</label><label><input type="radio" name="editTarget" value="_blank"> Neuer Tab</label></div></div>
 </div>
 <div class="edit-actions"><button class="edit-btn delete" id="deleteLink" type="button">Eintrag löschen</button><div class="edit-actions-right"><button class="edit-btn" id="editCancel" type="button">Abbrechen</button><button class="edit-btn primary" type="submit">Speichern</button></div></div>
</form>
</div>
<main class="portal-frame-container"><iframe id="portalFrame" name="portalFrame" src="../StartPage%20-%20General/NetApp-StartPage.htm" title="Portal-Inhalt"></iframe></main>
<script>
(() => {
 const KEY='portal.links.dividers.v2';
 const defaults=[
  {id:'startpage',type:'link',name:'StartPage',url:'../StartPage%20-%20General/NetApp-StartPage.htm',target:'portalFrame'},
  {id:'salespage',type:'link',name:'SalesPage',url:'../StartPage%20-%20General/NetApp-SalesPage.htm',target:'portalFrame'},
  {id:'compcar',type:'link',name:'CompCar',url:'../StartPage%20-%20General/CompCar.htm',target:'portalFrame'},
  {id:'onenote',type:'link',name:'SE OneNote',url:'https://netapp.sharepoint.com/:o:/r/sites/GermanySE-Team-Kippi/Shared%20Documents/Shared%20Documents/Enterprise_North_Central_internal_Notes?d=wc493b3d9e58d4de4a9158c2924395adb&csf=1&web=1&e=4h1ry3',target:'_blank'},
  {id:'divider-default',type:'divider'},
  {id:'hassio',type:'link',name:'hassio.cc',url:'http://hassio.cc',target:'_blank'},
  {id:'nrgkick',type:'link',name:'NRGKick',url:'https://nrgkick.com/mein-konto/',target:'_blank'},
  {id:'feedly',type:'link',name:'Feedly',url:'https://feedly.com/i/my/me',target:'_blank'},
  {id:'finanzblick',type:'link',name:'FinanzBlick',url:'https://finanzblick.buhl.de/',target:'_blank'}
 ];
 const $=id=>document.getElementById(id);
 const links=$('portalLinks'),menu=$('addMenu'),backdrop=$('editBackdrop'),form=$('editForm'),name=$('editName'),url=$('editUrl');
 const sidebarResizer=$('sidebarResizer'),sidebarToggle=$('sidebarToggle'),sidebarToggleLabel=$('sidebarToggleLabel'),bottomToggle=$('bottomToggle');
 const WIDTH_KEY='portal.sidebar.width.v1',COLLAPSED_KEY='portal.sidebar.collapsed.v1',LAST_FRAME_URL_KEY='portal.frame.lastUrl.v1';
 const portalFrame=$('portalFrame');
 const defaultFrameUrl=portalFrame.getAttribute('src');
 const savedFrameUrl=localStorage.getItem(LAST_FRAME_URL_KEY);
 if(savedFrameUrl){
  try{portalFrame.src=new URL(savedFrameUrl,window.location.href).href;}catch(e){localStorage.removeItem(LAST_FRAME_URL_KEY);}
 }
 document.addEventListener('click',e=>{
  const link=e.target.closest('a[target="portalFrame"]');
  if(!link||!link.href||link.href.endsWith('#'))return;
  localStorage.setItem(LAST_FRAME_URL_KEY,link.getAttribute('href')||link.href);
 },true);
 portalFrame.addEventListener('load',()=>{
  const currentSrc=portalFrame.getAttribute('src');
  if(currentSrc&&currentSrc!==defaultFrameUrl)localStorage.setItem(LAST_FRAME_URL_KEY,currentSrc);
 });
 let items; try { items=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults); } catch { items=structuredClone(defaults); }
 let editingId=null;
 let editMode=false;
 let dragItemId=null;
 const dropMarker=document.createElement('div'); dropMarker.className='drop-marker';
 let dropIndex=null;
 const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
 function clearDropClasses(){if(dropMarker&&dropMarker.parentNode)dropMarker.remove();dropMarker.style.display='none';dropIndex=null;}
 function draggableElements(){return [...links.children].filter(el=>el!==dropMarker&&!el.classList.contains('dragging'));}
 function positionDropMarker(clientY){
  if(!dragItemId)return;
  const elements=draggableElements();
  let index=elements.length;
  for(let i=0;i<elements.length;i++){
   const r=elements[i].getBoundingClientRect();
   if(clientY < r.top + r.height/2){index=i;break;}
  }
  dropIndex=index;
  dropMarker.style.display='block';
  if(index>=elements.length) links.appendChild(dropMarker); else links.insertBefore(dropMarker,elements[index]);
 }
 function moveItemByDrop(){
  if(!dragItemId||dropIndex===null)return;
  const from=items.findIndex(x=>x.id===dragItemId); if(from<0)return;
  const moving=items.splice(from,1)[0];
  let to=dropIndex; if(from<to)to--;
  to=Math.max(0,Math.min(to,items.length)); items.splice(to,0,moving); save(); render();
 }
 async function updateStockTicker(card,item){const priceEl=card.querySelector('.stock-ticker-price'),changeEl=card.querySelector('.stock-ticker-change'),nameEl=card.querySelector('.stock-ticker-name');try{const yahoo='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(item.symbol)+'?range=1d&interval=1d';const r=await fetch('https://proxy.cors.dev/'+yahoo,{credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json(),meta=data?.chart?.result?.[0]?.meta;if(!meta||!Number.isFinite(meta.regularMarketPrice))throw new Error('Kein Kurs');const price=meta.regularMarketPrice,previous=meta.chartPreviousClose??meta.previousClose,percent=Number.isFinite(previous)&&previous!==0?(price-previous)/previous*100:0,currency=meta.currency||'',currencySymbols={EUR:'€',USD:'$',GBP:'£',JPY:'¥',CNY:'¥',CHF:'CHF',CAD:'C$',AUD:'A$',NZD:'NZ$',SEK:'kr',NOK:'kr',DKK:'kr',PLN:'zł',CZK:'Kč',HUF:'Ft',INR:'₹',KRW:'₩',HKD:'HK$',SGD:'S$',ZAR:'R',BRL:'R$',MXN:'MX$'},currencyDisplay=currencySymbols[currency]||currency;nameEl.textContent=item.name||meta.longName||meta.shortName||meta.symbol||item.symbol;priceEl.textContent=(currencyDisplay?currencyDisplay+' ':'')+new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(price);changeEl.textContent=(percent>0?'+':'')+percent.toFixed(2).replace('.',',')+' %';changeEl.className='stock-ticker-change '+(percent>0?'positive':percent<0?'negative':'neutral')}catch(e){priceEl.textContent='Kurs nicht verfügbar';changeEl.textContent=item.symbol;changeEl.className='stock-ticker-change neutral'}}
 function render(){
  links.replaceChildren();
  items.forEach(item=>{
   if(item.type==='divider'){
    const hr=document.createElement('hr'); hr.className='portal-divider editable-divider'; hr.title='Ziehen zum Verschieben · Rechtsklick zum Entfernen'; hr.draggable=editMode; hr.dataset.id=item.id;
    hr.addEventListener('contextmenu',e=>{if(!editMode)return;e.preventDefault(); if(confirm('Trennstrich wirklich entfernen?')){items=items.filter(x=>x.id!==item.id);save();render();}});
    hr.addEventListener('dragstart',e=>{if(!editMode){e.preventDefault();return;}dragItemId=item.id;hr.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.id);});
    hr.addEventListener('dragend',()=>{dragItemId=null;clearDropClasses();hr.classList.remove('dragging');});
    links.appendChild(hr); return;
   }
   if(item.type==='stock'){
    const card=document.createElement('div');card.className='stock-ticker';card.dataset.id=item.id;card.draggable=editMode;card.innerHTML='<div class="stock-ticker-name"></div><div class="stock-ticker-market"><div class="stock-ticker-price">Kurs wird geladen …</div><div class="stock-ticker-change neutral">'+item.symbol+'</div></div>';card.querySelector('.stock-ticker-name').textContent=item.name||item.symbol;
    card.addEventListener('click',e=>{if(editMode)return;window.open('https://finance.yahoo.com/quote/'+encodeURIComponent(item.symbol),'_blank','noopener,noreferrer');});
    card.addEventListener('contextmenu',e=>{if(!editMode)return;e.preventDefault();if(confirm('Aktienticker „'+(item.name||item.symbol)+'“ wirklich löschen?')){items=items.filter(x=>x.id!==item.id);save();render();}});
    card.addEventListener('dragstart',e=>{if(!editMode){e.preventDefault();return;}dragItemId=item.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.id)});card.addEventListener('dragend',()=>{dragItemId=null;clearDropClasses();card.classList.remove('dragging')});links.appendChild(card);updateStockTicker(card,item);return;
   }
   const a=document.createElement('a'); a.dataset.id=item.id; a.href=item.url||'#'; a.target=item.target||'portalFrame'; a.title=item.url||'Kein Link hinterlegt'; a.draggable=editMode; if(a.target==='_blank')a.rel='noopener noreferrer';
   const favicon=document.createElement('img');favicon.className='portal-link-favicon';favicon.alt='';favicon.setAttribute('aria-hidden','true');
   if(item.url){try{const absoluteUrl=new URL(item.url,window.location.href);if(absoluteUrl.protocol==='http:'||absoluteUrl.protocol==='https:'){favicon.src='https://www.google.com/s2/favicons?domain_url='+encodeURIComponent(absoluteUrl.href)+'&sz=32';favicon.addEventListener('error',()=>favicon.remove(),{once:true});a.appendChild(favicon);}else if(absoluteUrl.protocol==='file:'){favicon.src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d8dadd' d='M6 2h8l4 4v16H6z'/%3E%3Cpath fill='%23858b91' d='M14 2v5h5z'/%3E%3Cpath fill='%239aa0a6' d='M8 11h8v1.5H8zm0 3h8v1.5H8zm0 3h6v1.5H8z'/%3E%3C/svg%3E";a.appendChild(favicon);}}catch(e){}}
   const label=document.createElement('span');label.className='portal-link-label';label.textContent=item.name;a.appendChild(label);
   a.addEventListener('click',e=>{if(!item.url)e.preventDefault();a.blur();});
   a.addEventListener('contextmenu',e=>{if(!editMode)return;e.preventDefault();openEdit(item.id);});
   a.addEventListener('dragstart',e=>{if(!editMode){e.preventDefault();return;}dragItemId=item.id;a.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.id);});
   a.addEventListener('dragend',()=>{dragItemId=null;clearDropClasses();a.classList.remove('dragging');});
   links.appendChild(a);
  });
 }
 function openEdit(id=null){
  editingId=id; const item=id?items.find(x=>x.id===id):null; $('editTitle').textContent=item?'Link bearbeiten':'Link hinzufügen'; name.value=item?.name||''; url.value=item?.url||''; $('deleteLink').hidden=!item;
  const target=item?.target||'portalFrame'; const r=document.querySelector(`input[name="editTarget"][value="${target}"]`); if(r)r.checked=true;
  backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden','false'); setTimeout(()=>name.focus(),0);
 }
 function closeEdit(){backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');editingId=null;form.reset();}
 links.addEventListener('dragover',e=>{if(!editMode||!dragItemId)return;e.preventDefault();e.dataTransfer.dropEffect='move';positionDropMarker(e.clientY);});
 links.addEventListener('drop',e=>{if(!editMode||!dragItemId)return;e.preventDefault();moveItemByDrop();clearDropClasses();});
 links.addEventListener('dragleave',e=>{if(!links.contains(e.relatedTarget))clearDropClasses();});
 $('addElementButton').addEventListener('click',e=>{e.stopPropagation();editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);menu.classList.toggle('open',editMode);menu.setAttribute('aria-hidden',String(!editMode));clearDropClasses();document.querySelectorAll('.portal-links a,.stock-ticker,.editable-divider').forEach(el=>{el.draggable=editMode;});});
 $('addLinkItem').addEventListener('click',()=>{menu.classList.remove('open');openEdit();});
 $('addDividerItem').addEventListener('click',()=>{items.push({id:'divider-'+Date.now(),type:'divider'});save();render();});
 $('addStockItem').addEventListener('click',()=>{const symbol=(prompt('Yahoo-Finance-Symbol eingeben, z. B. NTAP, AAPL, MSFT oder SAP.DE:')||'').trim().toUpperCase();if(!symbol)return;const stockName=(prompt('Anzeigename der Aktie (optional):',symbol)||'').trim();items.push({id:'stock-'+Date.now(),type:'stock',symbol,name:stockName});save();editMode=false;document.body.classList.remove('edit-mode');menu.classList.remove('open');menu.setAttribute('aria-hidden','true');clearDropClasses();render();});
  $('deleteAllPortal').addEventListener('click',()=>{if(!items.length)return;if(!confirm('Wirklich alle Portal-Einträge löschen? Diese Aktion entfernt alle Links, Trennstriche und Aktienticker.'))return;items=[];save();render();menu.classList.remove('open');});
$('exportPortal').addEventListener('click',async()=>{
  const payload={format:'NetApp Portal Export',version:1,exportedAt:new Date().toISOString(),items};
  const fileName='Portal-Export-'+new Date().toISOString().slice(0,10)+'.json';
  const json=JSON.stringify(payload,null,2);
  try{
   if('showSaveFilePicker' in window){
    const handle=await window.showSaveFilePicker({
     suggestedName:fileName,
     types:[{description:'JSON-Datei',accept:{'application/json':['.json']}}]
    });
    const writable=await handle.createWritable();
    await writable.write(json);
    await writable.close();
   }else{
    const blob=new Blob([json],{type:'application/json'}),downloadUrl=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=downloadUrl;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);
   }
  }catch(err){
   if(err?.name!=='AbortError')alert('Export nicht möglich: '+err.message);
  }
 });
 const importFile=$('importPortalFile');
 $('importPortal').addEventListener('click',()=>{importFile.value='';importFile.click();});
 importFile.addEventListener('change',async()=>{
  const file=importFile.files?.[0];if(!file)return;
  try{
   const parsed=JSON.parse(await file.text()),incoming=Array.isArray(parsed)?parsed:parsed?.items;
   if(!Array.isArray(incoming))throw new Error('Keine gültige Portal-Liste gefunden.');
   const valid=incoming.every(x=>x&&['link','divider','stock'].includes(x.type)&&typeof x.id==='string'&&(x.type!=='link'||(typeof x.name==='string'&&typeof x.url==='string'))&&(x.type!=='stock'||typeof x.symbol==='string'));
   if(!valid)throw new Error('Die Datei enthält ungültige Portal-Elemente.');
   if(!confirm('Import ersetzt die aktuelle Portal-Konfiguration mit allen Links, Trennstrichen und Aktien. Fortfahren?'))return;
   items=incoming.map(x=>({...x}));save();sidebarWidth=clampSidebarWidth(sidebarWidth);document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px');render();
   alert('Portal-Konfiguration erfolgreich importiert.');
  }catch(err){alert('Import nicht möglich: '+err.message);}
 });
 menu.addEventListener('click',e=>{if(e.target.closest('button'))menu.classList.remove('open');});
 document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!$('addElementButton').contains(e.target)){menu.classList.remove('open');if(editMode){editMode=false;document.body.classList.remove('edit-mode');menu.setAttribute('aria-hidden','true');clearDropClasses();document.querySelectorAll('.portal-links a,.stock-ticker,.editable-divider').forEach(el=>{el.draggable=false;});}}});
 $('editClose').addEventListener('click',closeEdit); $('editCancel').addEventListener('click',closeEdit);
 backdrop.addEventListener('mousedown',e=>{if(e.target===backdrop)closeEdit();});
 form.addEventListener('submit',e=>{e.preventDefault();const n=name.value.trim(),u=url.value.trim(),t=document.querySelector('input[name="editTarget"]:checked')?.value||'portalFrame';if(!n)return;if(editingId){const item=items.find(x=>x.id===editingId);Object.assign(item,{name:n,url:u,target:t});}else items.push({id:'link-'+Date.now(),type:'link',name:n,url:u,target:t});save();render();closeEdit();});
 $('deleteLink').addEventListener('click',()=>{const item=items.find(x=>x.id===editingId);if(item&&confirm(`Eintrag „${item.name}“ wirklich löschen?`)){items=items.filter(x=>x.id!==editingId);save();render();closeEdit();}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');if(backdrop.classList.contains('open'))closeEdit();}});
 const MAX_SIDEBAR_WIDTH=360;
 function getSidebarMinWidth(){const probe=document.createElement('span');probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:500 14px Segoe UI,system-ui,sans-serif';document.body.appendChild(probe);let widest=0;items.filter(x=>x.type==='link').forEach(x=>{probe.textContent=x.name||'';widest=Math.max(widest,probe.getBoundingClientRect().width)});probe.remove();return Math.min(MAX_SIDEBAR_WIDTH,Math.max(96,Math.ceil(widest+66)));}
 const clampSidebarWidth=v=>Math.max(getSidebarMinWidth(),Math.min(MAX_SIDEBAR_WIDTH,v));
 let sidebarWidth=clampSidebarWidth(Number(localStorage.getItem(WIDTH_KEY))||120);
 document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px');
 let collapsed=localStorage.getItem(COLLAPSED_KEY)==='true';
 function applyCollapsed(){
  document.body.classList.toggle('sidebar-collapsed',collapsed);
  sidebarToggleLabel.textContent=collapsed?'◎ Portal':'‹';
  sidebarToggle.setAttribute('aria-label',collapsed?'Portalmenü ausklappen':'Portalmenü einklappen');
  sidebarToggle.setAttribute('aria-expanded',String(!collapsed));
 }
 const toggleSidebar=()=>{collapsed=!collapsed;localStorage.setItem(COLLAPSED_KEY,String(collapsed));applyCollapsed();};
 sidebarToggle.addEventListener('click',toggleSidebar);
 bottomToggle.addEventListener('click',toggleSidebar);
 sidebarResizer.addEventListener('pointerdown',e=>{
  if(collapsed)return;
  e.preventDefault(); sidebarResizer.setPointerCapture(e.pointerId); document.body.classList.add('resizing');
  const move=ev=>{sidebarWidth=clampSidebarWidth(ev.clientX);document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px');};
  const up=ev=>{move(ev);localStorage.setItem(WIDTH_KEY,String(Math.round(sidebarWidth)));document.body.classList.remove('resizing');sidebarResizer.releasePointerCapture(ev.pointerId);sidebarResizer.removeEventListener('pointermove',move);sidebarResizer.removeEventListener('pointerup',up);sidebarResizer.removeEventListener('pointercancel',up);};
  sidebarResizer.addEventListener('pointermove',move);sidebarResizer.addEventListener('pointerup',up);sidebarResizer.addEventListener('pointercancel',up);
 });
 sidebarResizer.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();sidebarWidth=clampSidebarWidth(sidebarWidth+(e.key==='ArrowRight'?10:-10));document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px');localStorage.setItem(WIDTH_KEY,String(sidebarWidth));
 });
 sidebarResizer.tabIndex=0; applyCollapsed();
 const weekday=$('portalWeekday'),date=$('portalDate'),time=$('portalTime'); function updateDateTime(){const now=new Date();weekday.textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long'}).format(now);date.textContent=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(now);time.textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',hour12:false}).format(now)}updateDateTime();setInterval(updateDateTime,1000);
 render();
 setInterval(()=>document.querySelectorAll('.stock-ticker').forEach(card=>{const item=items.find(x=>x.id===card.dataset.id);if(item)updateStockTicker(card,item)}),300000);
})();
</script>
</body>
